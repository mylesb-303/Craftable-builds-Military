name: Package Bedrock Add-On

on:
  workflow_dispatch:
  push:
    branches:
      - "codex/**"
      - "claude/**"

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Validate JSON
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          roots = [Path("Cavira_Craftable_Builds_BP"), Path("Cavira_Craftable_Builds_RP")]
          files = []
          for root in roots:
              files.extend(root.rglob("*.json"))
          for path in files:
              with path.open("r", encoding="utf-8") as handle:
                  json.load(handle)
              print(f"OK {path}")
          PY

      - name: Check JavaScript syntax
        run: |
          find Cavira_Craftable_Builds_BP/scripts -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Run engine regression harness
        run: |
          rm -rf tools/engine-harness/scripts
          cp -r Cavira_Craftable_Builds_BP/scripts tools/engine-harness/scripts
          cd tools/engine-harness
          node test.mjs | tee result.txt
          grep -q "failures=0" result.txt
          ! grep -q "FAIL" result.txt
          node dircheck.mjs | grep -q PASS
          node snapcheck.mjs | grep -q "SNAP PASS"
          node snapcheck2.mjs | grep -q "SNAP2 PASS"
          node chunkcheck.mjs
          node sectioncheck.mjs | tee sections.txt
          grep -q "SECTIONS PASS" sections.txt
          node loadsim.mjs | tee loadsim.txt
          grep -q "LOADSIM PASS" loadsim.txt
          grep -q "RESUME PASS" loadsim.txt
          SLICE_MS=40 node slicecheck.mjs | tee slices.txt
          grep -q "SLICE PASS" slices.txt
          node envelopecheck.mjs | tee envelope.txt
          grep -q "ENVELOPE PASS" envelope.txt
          node lightfixcheck.mjs | tee lightfix.txt
          grep -q "LIGHTFIX PASS" lightfix.txt
          node holocheck.mjs | tee holo.txt
          grep -q "HOLO PASS" holo.txt
          grep -q "DRAW PASS" holo.txt
          node rwlightcheck.mjs | tee rwl.txt
          grep -q "RWLIGHTS PASS" rwl.txt
          node maproomcheck.mjs | tee maproom.txt
          grep -q "MAPROOM PASS" maproom.txt
          node passes.mjs | tee passes.txt
          ! awk '{split($0,a,"dark -> "); split(a[2],b," "); if (b[1]!="0" && $0 !~ /overlay/) bad=1} END{exit !bad}' passes.txt
          node wallcheck.mjs | tee wall.txt
          grep -q "WALL PASS" wall.txt

      - name: Build mcaddon
        run: |
          mkdir -p dist
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED
          output = Path("dist/Cavira_Craftable_Builds_1.12.0_Airfield_Expansion.mcaddon")
          roots = [Path("Cavira_Craftable_Builds_BP"), Path("Cavira_Craftable_Builds_RP")]
          with ZipFile(output, "w", ZIP_DEFLATED) as archive:
              for root in roots:
                  for path in root.rglob("*"):
                      if path.is_file():
                          archive.write(path, path.as_posix())
          print(output)
          PY

      - name: Upload test package
        uses: actions/upload-artifact@v4
        with:
          name: Cavira-Craftable-Builds-1.12.0-Airfield-Expansion
          path: dist/Cavira_Craftable_Builds_1.12.0_Airfield_Expansion.mcaddon
