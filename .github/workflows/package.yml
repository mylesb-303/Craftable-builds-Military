name: Package Bedrock Add-On

on:
  workflow_dispatch:
  push:
    branches:
      - "codex/**"
      - "claude/**"

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Validate JSON
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          roots = [Path("Cavira_Craftable_Builds_BP"), Path("Cavira_Craftable_Builds_RP")]
          files = []
          for root in roots:
              files.extend(root.rglob("*.json"))
          for path in files:
              with path.open("r", encoding="utf-8") as handle:
                  json.load(handle)
              print(f"OK {path}")
          PY

      - name: Check JavaScript syntax
        run: |
          find Cavira_Craftable_Builds_BP/scripts -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Run engine regression harness
        run: |
          rm -rf tools/engine-harness/scripts
          cp -r Cavira_Craftable_Builds_BP/scripts tools/engine-harness/scripts
          cd tools/engine-harness
          node test.mjs | tee result.txt
          grep -q "failures=0" result.txt
          ! grep -q "FAIL" result.txt
          node dircheck.mjs | grep -q PASS
          node snapcheck.mjs | grep -q "SNAP PASS"
          node chunkcheck.mjs
          for b in small_nuclear_bunker medium_nuclear_bunker large_nuclear_bunker strategic_operations_bunker; do
            node inspect.mjs $b | tee walk.txt
            grep -q "FLOORS OK" walk.txt
          done

      - name: Build mcaddon
        run: |
          mkdir -p dist
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED
          output = Path("dist/Cavira_Craftable_Builds_1.6.0_Airfield_Dishes_ChunkLoading.mcaddon")
          roots = [Path("Cavira_Craftable_Builds_BP"), Path("Cavira_Craftable_Builds_RP")]
          with ZipFile(output, "w", ZIP_DEFLATED) as archive:
              for root in roots:
                  for path in root.rglob("*"):
                      if path.is_file():
                          archive.write(path, path.as_posix())
          print(output)
          PY

      - name: Upload test package
        uses: actions/upload-artifact@v4
        with:
          name: Cavira-Craftable-Builds-1.6.0-Airfield-Dishes-ChunkLoading
          path: dist/Cavira_Craftable_Builds_1.6.0_Airfield_Dishes_ChunkLoading.mcaddon
